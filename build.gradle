plugins {
    id 'java'
}

version = providers.fileContents(layout.projectDirectory.file('version.txt')).asText.get().trim()
if (!(version ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/)) {
    throw new GradleException('version.txt must contain a stable SemVer version (MAJOR.MINOR.PATCH).')
}

repositories {
    mavenCentral()
}

// Compile against the exact installed IDE, including its bundled Java and XML plugins.
def ideaHome = providers.gradleProperty('ideaHome').orElse(providers.environmentVariable('IDEA_HOME'))
def sdk = files(ideaHome.orElse(providers.provider {
    throw new GradleException('Set IDEA_HOME (or -PideaHome) to the IntelliJ IDEA installation directory.')
}).map { path ->
    def installation = file(path)
    def ide = new File(installation, 'Contents/lib').isDirectory() ? new File(installation, 'Contents') : installation
    if (!new File(ide, 'plugins/xml-plugin/lib').isDirectory() || !new File(ide, 'plugins/java/lib').isDirectory()) {
        throw new GradleException("No bundled Java/XML plugins under ${ide}")
    }
    def jars = [fileTree(new File(ide, 'lib')) { include '*.jar' }]
    for (def plugin : ['java', 'xml-plugin']) {
        jars.add(fileTree(new File(ide, "plugins/${plugin}/lib")) { include '*.jar', 'modules/*.jar' })
    }
    jars
})

dependencies {
    compileOnly sdk
    testImplementation sdk
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    inputs.property('pluginVersion', version)
    filesMatching('META-INF/plugin.xml') {
        filter { line -> line.replace('${pluginVersion}', project.version.toString()) }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('buildPlugin', Zip) {
    archiveBaseName = 'talend-idea-plugin'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('talend-idea-plugin/lib') {
        from(tasks.jar)
    }
}
